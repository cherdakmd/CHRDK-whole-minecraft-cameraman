name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify jar contents
        run: |
          set -e
          JAR=target/cameraman-2.0.0.jar
          test -f "$JAR"
          echo "--- jar entries ---"
          unzip -l "$JAR"
          echo "--- filtered plugin.yml ---"
          unzip -p "$JAR" plugin.yml | tee /tmp/plugin.yml
          grep -q "api-version: '26.3'" /tmp/plugin.yml
          grep -q "version: '2.0.0'" /tmp/plugin.yml
          grep -q "main: xyz.shibomb.cameraman.CameramanPlugin" /tmp/plugin.yml
          echo "--- bytecode level (Java 25 = major version 69) ---"
          javap -verbose -cp "$JAR" xyz.shibomb.cameraman.CameramanPlugin | grep "major version"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: cameraman-26.3
          path: target/cameraman-*.jar
          if-no-files-found: error
